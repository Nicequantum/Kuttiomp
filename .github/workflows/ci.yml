name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -q

  api-image:
    name: API Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/api image
        run: docker build -t kuttiomp-api ./apps/api

  admin:
    name: Admin typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace=@kuttiomp/admin
      - name: Next.js build (placeholder public env, no live secrets)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build --workspace=@kuttiomp/admin
