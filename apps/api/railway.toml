# Used when Railway Root Directory is apps/api and Config File is
# /apps/api/railway.toml. Watch patterns still match from the repo root.

[build]
builder = "DOCKERFILE"
watchPatterns = ["apps/api/**"]

[deploy]
# Omit startCommand so Railway uses the Dockerfile CMD, which shell-expands PORT.
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
